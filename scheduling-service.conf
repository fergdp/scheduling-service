[program:scheduling-service]
command=/opt/scheduling-service/venv/bin/gunicorn -w 2 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8002 main:app
directory=/opt/scheduling-service
user=appuser
autostart=true
autorestart=true
stderr_logfile=/var/log/scheduling-service.err.log
stdout_logfile=/var/log/scheduling-service.out.log
environment=APP_ENVIRONMENT="production",LOKI_URL="http://localhost:3100",APP_VERSION="1.0.0"
